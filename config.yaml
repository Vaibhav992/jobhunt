# jobhunt configuration. Everything tunable lives here — no editing Python.
#
# Tune `filters` first. It is deterministic, free, and it is what keeps the
# LLM bill small: roughly 2000 raw postings -> 40 candidates before a single
# token is spent.

filters:
  # Title regexes, matched case-insensitively against the job title only.
  # A title must match at least one include AND zero excludes.
  #
  # Gotcha: "sde" as a bare regex does NOT match "Software Development
  # Engineer" — different words entirely. Use \bsde\b for the acronym and
  # list the spelled-out variants separately, as below.
  include_titles:
    - '\b(software|backend|back-end|server|platform|infrastructure|systems|distributed|cloud|devops)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(software|backend|back-end|java|platform|infrastructure|infra|systems|distributed|cloud|devops)\b'
    - '\bsde\b'
    - '\bsde\s*-?\s*(i|1)\b'
    - 'software development engineer'
    - '\b(associate|junior|entry[- ]level)?\s*software (engineer|developer)\b'
    - '\bsoftware developer\b'
    - '\bjava (engineer|developer)\b'
    - '\b(full[- ]stack|fullstack) (software )?(engineer|developer)\b'
    - '\b(site reliability engineer|sre|devops engineer)\b'
    - '\b(fresher|freshers|new[- ]grad(?:uate)?|campus hire)\b.*\b(software|java|backend|full[- ]stack|sde|developer|engineer)\b'
    - '\b(software|java|backend|full[- ]stack|sde|developer|engineer)\b.*\b(fresher|freshers|new[- ]grad(?:uate)?)\b'
    - '\b(graduate (software )?engineer( trainee)?|get)\b'
    - '\bsoftware trainee\b'

  # Anything matching these is dropped even if an include matched.
  exclude_titles:
    - '\b(staff|principal|distinguished|fellow|architect|lead)\b' # too senior for now
    # With 1 year of experience, senior roles are unlikely to pass screening.
    # Dropping them here avoids unnecessary LLM calls. Delete this line once
    # you have enough experience, or if you want to stretch-apply anyway.
    - '\bsenior\b'
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'
    # Internships stay out. Fresher / GET / graduate-trainee full-time roles
    # are in scope — the candidate will tailor the resume per posting.
    - '\b(intern|internship|apprentice)\b'
    - '\b(sales|account executive|marketing|recruit|support|success)\b'
    - '\b(frontend|front-end|ios|android|mobile|game|designer)\b' # wrong discipline
    - '\b(data scientist|machine learning scientist|research scientist)\b'

  # Substrings matched against "<location> <title>", case-insensitive.
  # Leave empty to accept every location.
  locations:
    - bangalore
    - bengaluru
    - india
    - hyderabad
    - pune
    - mumbai
    - delhi
    - new delhi
    - delhi ncr
    - gurugram
    - gurgaon
    - noida
    - chennai
    - kolkata
    - ahmedabad
    - jaipur
    - kochi
    - cochin
    - indore
    - chandigarh
    - bhubaneswar
    - thiruvananthapuram
    - kerala
    - karnataka
    - telangana
    - maharashtra
    - tamil nadu
    - west bengal
    - gujarat
    - rajasthan
    - madhya pradesh
    - uttar pradesh
    - haryana

  # If true, anything reading as remote passes the location gate.
  allow_remote: true

  # Drop postings older than this. Set to null to disable.
  # Boards often re-stamp `updated_at`, so this is a soft signal, not a promise.
  max_age_days: 30

  # Reject jobs that explicitly ask for more than this many years of experience.
  max_experience_years: 2

# --- screening (the one LLM cost in list mode) ------------------------------
screen_batch_size: 8      # jobs per screening call. Higher = cheaper, sloppier.
screen_jd_chars: 1400     # JD truncation for screening
max_screen: 400           # token guard: never screen more than this in one run
                          # (newest-first). Protects against a first-run flood
                          # or a big new-board dump. The prefilter usually keeps
                          # you well under this, so it rarely bites.

# --- digest (the "50+ a day" ranked list) -----------------------------------
digest_min_score: 6.0     # list every match scoring at or above this
digest_size: 60           # cap the list length so the email stays readable

# --- drafting (OFF by default; opt in per run with `run --draft-top N`) ------
draft_jd_chars: 6000      # JD truncation when writing a full application kit

# Legacy aliases, still honoured as fallbacks when the keys above are absent:
score_threshold: 7.0      # -> digest_min_score
max_per_digest: 5         # -> digest_size

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv
