# Boards to poll. One entry per company (or one aggregator row).
#
#   ats:   greenhouse | lever | ashby | remotive | workable
#          | smartrecruiters | recruitee | arbeitnow
#   slug:  the company's board identifier (NOT its domain)
#   name:  whatever you want to see in the digest
#
# The slug is the last path segment of the company's public careers board:
#   https://boards.greenhouse.io/<slug>              -> greenhouse
#   https://jobs.lever.co/<slug>                     -> lever
#   https://jobs.ashbyhq.com/<slug>                  -> ashby
#   https://apply.workable.com/<slug>                -> workable
#   https://jobs.smartrecruiters.com/<Slug>          -> smartrecruiters (keep capitalisation)
#   https://<slug>.recruitee.com                     -> recruitee
#   Remotive / Arbeitnow: slug is a category filter, e.g. software-development|devops
#
# THESE ARE PUBLIC JSON BOARDS — no HTML scraping, no LinkedIn / Indeed / Naukri.
# A dead slug prints an HTTP status and returns []; it never kills the run.
# python -m jobhunt validate

